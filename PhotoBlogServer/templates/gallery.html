<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>빛의 기록 · Photo Blog</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f3ee;color:#242b25;font-family:Arial,'Apple SD Gothic Neo',sans-serif}header{padding:24px 6vw;border-bottom:1px solid #d8ddd3;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;letter-spacing:-1px;font-size:24px}header a{color:#314d39;text-decoration:none;margin-left:22px;font-size:13px}.dot{display:inline-block;background:#83b491;width:8px;height:8px;border-radius:50%;margin-right:8px}main{max-width:1280px;margin:auto;padding:50px 6vw}.eyebrow{font-size:11px;letter-spacing:3px;color:#607563}h1{font-size:clamp(36px,5vw,64px);letter-spacing:-3px;font-weight:500;margin:18px 0}p{color:#657166;line-height:1.7}.toolbar{display:flex;gap:12px;align-items:center;margin:36px 0 24px;flex-wrap:wrap}input,select,button{font:inherit;border:1px solid #cbd2c9;padding:12px 16px;border-radius:8px;background:white;color:#293d2d}input{flex:1;min-width:160px}button{cursor:pointer;background:#304c39;color:white}button:disabled{opacity:.4;cursor:default}#count{font-size:13px;color:#69776b;margin-left:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.card{background:#fff;border-radius:12px;overflow:hidden;border:1px solid #e1e5dc}.card img{width:100%;aspect-ratio:4/3;object-fit:cover}.body{padding:20px}.meta{color:#718273;font-size:11px;letter-spacing:1px}h2{font-size:20px;margin:12px 0 6px}.body p{font-size:13px;margin:0;min-height:40px;white-space:pre-wrap}.pager{display:flex;justify-content:center;gap:16px;margin:30px}footer{border-top:1px solid #d8ddd3;padding-top:22px;font-size:11px;color:#788378;display:flex;justify-content:space-between}#status{font-size:13px;min-height:22px}a{color:#304c39}@media(max-width:760px){.grid{grid-template-columns:1fr}header{gap:15px}main{padding-top:30px}header a{margin-left:8px}}
</style></head><body><header><div class="brand">◉ 빛의 기록</div><nav><a href="/post/new/">＋ 새 사진</a><a href="/api_root/Post/">강의 API ↗</a><a href="/api/posts/">REST API ↗</a><a href="/admin/">관리자 ↗</a><a href="/api/health/"><span class="dot"></span>SERVER ONLINE</a></nav></header><main><div class="eyebrow">PHOTO JOURNAL / 일상의 조각</div><h1>지나간 순간을,<br>오래 머물게.</h1><p>Android에서 담은 사진과 이야기를 이곳에서 함께 봅니다.<br>사진 한 장으로 시작하는 나만의 포토 블로그.</p><form class="toolbar" id="searchForm"><input id="search" aria-label="사진 검색" placeholder="제목, 이야기, 작성자 검색"><select id="order" aria-label="정렬"><option value="-created_at">최신순</option><option value="created_at">오래된순</option><option value="title">제목순</option></select><button type="submit">검색</button><span id="count"></span></form><div id="status" role="status"></div><section class="grid" id="gallery"></section><div class="pager"><button id="prev">← 이전</button><button id="next">다음 →</button></div><footer><span>PHOTO BLOG · Django × Android</span><span>소중한 순간을 연결합니다</span></footer></main>
<script>
let current=1;const $=id=>document.getElementById(id);async function load(page=1){current=page;$('status').textContent='사진을 불러오는 중…';try{const q=new URLSearchParams({page,search:$('search').value,ordering:$('order').value});const response=await fetch('/api/posts/?'+q);if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();$('gallery').replaceChildren();for(const post of data.results){const card=document.createElement('article');card.className='card';const img=document.createElement('img');img.src=post.image;img.alt=post.title;img.loading='lazy';const body=document.createElement('div');body.className='body';const meta=document.createElement('div');meta.className='meta';meta.textContent=post.author+' · '+new Date(post.created_at).toLocaleDateString('ko-KR');const title=document.createElement('h2');const link=document.createElement('a');link.href='/post/'+post.id+'/';link.textContent=post.title;title.append(link);const text=document.createElement('p');text.textContent=post.text;body.append(meta,title,text);card.append(img,body);$('gallery').append(card)}$('count').textContent=data.count+'개의 기록';$('status').textContent=data.count?'':'아직 사진이 없습니다. Android 앱에서 첫 사진을 올려보세요.';$('prev').disabled=!data.previous;$('next').disabled=!data.next}catch(error){$('status').textContent='연결 실패: '+error.message}}$('searchForm').onsubmit=e=>{e.preventDefault();load()};$('order').onchange=()=>load();$('prev').onclick=()=>load(current-1);$('next').onclick=()=>load(current+1);load();
</script></body></html>
