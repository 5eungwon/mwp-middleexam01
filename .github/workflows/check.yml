name: Server and Android checks
on: [push, pull_request]
jobs:
  server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r PhotoBlogServer/requirements-test.txt
      - working-directory: PhotoBlogServer
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python -m coverage run manage.py test -v 2
          python -m coverage report --fail-under=90
          python -m coverage html
      - uses: actions/upload-artifact@v4
        with:
          name: Server-coverage
          path: docs/coverage
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - uses: gradle/actions/setup-gradle@v4
      - working-directory: PhotoViewer
        run: ./gradlew :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoViewer-debug
          path: PhotoViewer/app/build/outputs/apk/debug/app-debug.apk
